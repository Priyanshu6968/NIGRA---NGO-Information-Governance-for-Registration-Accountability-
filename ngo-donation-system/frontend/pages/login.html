<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIGRA | Login</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-card glass-card animate-fade-in">
        <h1 class="logo" style="text-align: center; margin-bottom: 2rem;">NIGRA</h1>
        <h2 style="margin-bottom: 1.5rem; text-align: center;">Welcome Back</h2>
        
        <div id="alert" class="alert alert-error"></div>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.875rem;">
            Don't have an account? <a href="register.html" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Register here</a>
        </p>
    </div>

    <script src="../js/auth.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const alertBox = document.getElementById('alert');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const result = await auth.login(email, password);
            if (result.success) {
                auth.redirectByRole(result.role);
            } else {
                alertBox.textContent = result.error;
                alertBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
